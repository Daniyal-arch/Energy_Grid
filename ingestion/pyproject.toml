[project]
name = "gridwatch-ingestion"
version = "0.1.0"
description = "gridwatch data-source adapters and pipeline jobs"
requires-python = ">=3.11"
dependencies = [
    "gridwatch-backend",
    "httpx>=0.27",
    "earthengine-api>=1.4",
    "open-mastr>=0.14",
    "shapely>=2.0",
]

[tool.uv.sources]
gridwatch-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
