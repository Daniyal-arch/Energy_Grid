# sam deploy --config-file backend/deploy/samconfig.toml --parameter-overrides ImageUri=<ecr uri>:<tag>
version = 0.1

[default.deploy.parameters]
stack_name = "infraatlas-backend"
region = "eu-central-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = false
template_file = "template.yaml"
