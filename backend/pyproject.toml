[project]
name = "infraatlas-backend"
version = "0.1.0"
description = "InfraAtlas data service and agent (FastAPI, LangGraph, DuckDB) for AWS Lambda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "duckdb>=1.2",
    "sqlglot>=25",
    "langgraph>=0.4",
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "mcp>=1.9",
    "langchain-mcp-adapters>=0.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "langfuse>=3.0",
    "boto3>=1.35",
    "rasterio>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
google = ["langchain-google-genai>=2.0"]
aws = ["langchain-aws>=0.2"]
ollama = ["langchain-ollama>=0.3"]
groq = ["langchain-groq>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyarrow>=17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501", "SIM117"]
"probes/**" = ["ANN", "E501"]
"scripts/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
