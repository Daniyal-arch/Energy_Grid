# Generated by scripts/wave9.py render (brief 30): the registry rasters of waves 9 and
# 10 as area_stats measures. Edit scripts/wave*_sources.yaml, not this file.
measures:
  w9_eu_effis_danger:
    title: EFFIS fire danger
    unit: index (dimensionless)
    stat: mean
    how: mean of the cells whose centre lies inside the area
    licence: CC BY 4.0
    layers:
    - url: r2://infraatlas-raw/lake/rasters/wave9/eu_effis_danger.tif
      cell: 0.1 x 0.1 (EPSG:4326)
      cover: EUR
  w9_eu_emodnet_bathy:
    title: EMODnet bathymetry
    unit: m (negative below sea level)
    stat: mean
    how: mean of the cells whose centre lies inside the area
    licence: CC BY 4.0
