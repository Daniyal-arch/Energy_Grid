# The level matrix (docs/tasks/27, A5): which dataset answers at which level of the ladder.
# point: rows with a position (counted or summed inside any area with in_area);
# line / polygon: geometries (km_inside, km2_inside, intersects_area);
# a level name: rows keyed by that unit (join by key when the area is that unit; for a drawn
# area, sum the units wholly inside and list the ones partly inside with their full values);
# raster: area_stats (cells whose centre lies inside). Coverage per country: data/coverage.yaml.
