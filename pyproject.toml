[project]
name = "europe-infraatlas"
version = "0.2.0"
description = "Europe's power system as an interactive map: grid, plants, cross-border flows, prices"
requires-python = ">=3.11"
# the data scripts in scripts/ (fetch + build the files the frontend reads)
dependencies = [
    "duckdb>=1.1",  # Overture GeoParquet for the US lines (fetch_us_lines.py)
    "eccodes>=2.49.0",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pycountry>=26.2.16",
    "pyproj>=3.7.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "shapely>=2.0",
    "tzdata>=2024.1",  # time zones on Windows (build_eu_day.py)
    "tzfpy>=2.1.1",  # a plant's time zone from its coordinates (build_us_units.py)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
# wave 7 fixtures quote the operators' rows as published
"tests/test_wave7.py" = ["ANN", "E501"]
"tests/test_connect_harmonised.py" = ["ANN", "E501"]
# probe/one-off scripts are exploratory: allow long lines and lambda-in-loop
"scripts/**" = ["ANN", "E501", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
