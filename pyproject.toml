[project]
name = "gridwatch"
version = "0.1.0"
description = "Satellite-based construction monitoring for German energy infrastructure (workspace root)"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["backend", "ingestion"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ingestion/tests"]
