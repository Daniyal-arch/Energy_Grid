[project]
name = "europe-infraatlas"
version = "0.2.0"
description = "Europe's power system as an interactive map: grid, plants, cross-border flows, prices"
requires-python = ">=3.11"
# the data scripts in scripts/ (fetch + build the files the frontend reads)
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "tzdata>=2024.1",  # time zones on Windows (build_eu_day.py)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
# probe/one-off scripts are exploratory: allow long lines and lambda-in-loop
"scripts/**" = ["ANN", "E501", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
