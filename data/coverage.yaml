        checked: '2026-10-27'
      SK:
        status: built
        url: https://www.zsdis.sk/Uvod/Online-sluzby/Mapa-pripojitelnosti
        note: SEPS publishes a Power BI report only; SSD resets the connection (2026-10-27)
        partial: true
        source: ZSD and VSD connectability map (HV/MV substations, free MW for consumption and sources)
        licence: operator website (public information)
        dataset: eu/connect/harmonised.json
        checked: '2026-10-27'
      SI:
