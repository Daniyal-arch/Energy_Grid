        source: Terna Econnextion
        url: https://dati.terna.it
        licence: CC BY 4.0
        dataset: eu/connect/it.json
        checked: '2026-10-19'
        note: wave 6 (brief 21)
      LV:
        status: not_published
        url: https://karte.sadalestikls.lv/lv/briva-jauda
        note: AST answers HTTP 403 behind Cloudflare; Sadales tīkls' free-capacity map loads from an obfuscated host and answers HTTP 451 to a script that names itself (not bypassed)
        checked: '2026-10-27'
      LT:
        status: built
        licence: public notice; reuse with the source named
        source: Litgrid generation capacity map
        url: https://experience.arcgis.com/experience/1aa8fb2983c34b7bbc4343d22d9071a5
        dataset: eu/connect/lt.json, lake connect_eu/lt
        checked: '2026-10-19'
      LU:
        status: built
        licence: public notice; reuse with the source named
        source: Creos grid hosting capacity map
        url: https://www.creos-net.lu/en/pro-space/products-services/grid-hosting-capacity
        dataset: eu/connect/lu.json, lake connect_eu/lu
        checked: '2026-10-19'
      MT:
        status: built
        licence: public notice; reuse with the source named
        source: Enemalta available capacity map
        url: https://enemalta.com.mt/available-capacity/
        dataset: eu/connect/mt.json, lake connect_eu/mt
        checked: '2026-10-19'
      NL:
        status: have
        source: Netbeheer Nederland capaciteitskaart
        url: https://capaciteitskaart.netbeheernederland.nl
        licence: public
        dataset: eu/connect.json (nl)
        checked: '2026-10-15'
      PL:
        status: have
        source: PSE connection lists
        url: https://www.pse.pl/obszary-dzialalnosci/krajowy-system-elektroenergetyczny/wykaz-obiektow-planowanych-do-przylaczenia
        licence: public
        dataset: eu/connect/pl.json
        checked: '2026-10-19'
        note: wave 6 (brief 21)
      PT:
        status: have
        source: E-REDES capacidade de receção
        url: https://e-redes.opendatasoft.com
        licence: CC BY 4.0
        dataset: eu/connect/pt.json
        checked: '2026-10-19'
        note: wave 6 (brief 21)
      RO:
