        - name: ERCOT
          status: have
          source: gridstatus
        - name: MISO
          status: have
          source: gridstatus
        - name: SPP
          status: have
          source: gridstatus
        - name: ISO-NE
          status: have
          source: gridstatus
        - name: NYISO
