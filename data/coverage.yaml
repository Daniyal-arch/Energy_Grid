        source: Elenia (production and consumption MW per main transformer); Helen Sähköverkko (free MV capacity, MVA, per primary substation area)
        licence: Elenia public web map (no licence stated)
        dataset: eu/connect/harmonised.json
        checked: '2026-10-28'
      FR:
