          source: NESO TEC register
        - name: NGED
          status: built
          source: LTDS capacity heatmap (WPD Open Data Licence)
        - name: SSEN
          status: built
          source: headroom dashboard CSV (CC BY 4.0)
        - name: NPg
          status: built
          source: heat map data table (Northern Powergrid Open Data Licence)
        - name: ENWL
          status: blocked
          source: Opendatasoft export empty without an account key (ENWL_API_KEY)
        - name: SPEN
          status: blocked
          source: Opendatasoft export empty without an account key (SPEN_API_KEY)
        - name: UKPN
          status: blocked
          source: Opendatasoft export empty without an account key (UKPN_API_KEY)
        - name: NIE Networks (Northern Ireland)
          status: built
          source: capacity map JSON (demand and generation headroom, MVA)
        - name: SONI (Northern Ireland transmission)
          status: not_published
          source: no transmission capacity map found on soni.ltd.uk (2026-10-28)
        checked: '2026-10-28'
