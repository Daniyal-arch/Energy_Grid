          source: 'OASIS documents only (certificate chain incomplete for scripts); BPA: ArcGIS app and queue xlsx; NV Energy: queue layer without MW'
        - name: Distribution hosting capacity (feeders)
          status: not_published
          source: 'National Grid NY, Eversource MA/NH and others publish per feeder line: needs the line kind and PMTiles (next step)'
        partial: true
        note: ConEd, National Grid NY/MA, Xcel, Duke and Dominion publish hosting capacity per feeder line or grid cell only (not nodes); MISO and SPP headroom tools are interactive
        checked: '2026-10-28'
