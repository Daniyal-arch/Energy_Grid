        - name: Idaho Power
          status: built
          source: ArcGIS heatmap, maximum injection MW per substation
        - name: LG&E and KU
          status: built
          source: ArcGIS heatmap, transfer limit MW per bus
        - name: Avista
          status: built
          source: ArcGIS heatmap, injection steps per bus
        - name: MISO heatmap
