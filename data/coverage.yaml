        source: MAVIR station list (xlsx, the DSOs' stations included), MVM Démász and MVM Émász free capacity for load (PDF tables)
        licence: operators' websites (public information)
        dataset: eu/connect/harmonised.json
        checked: '2026-10-27'
      IE:
