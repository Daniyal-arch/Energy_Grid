  live_mix:
    name: Live mix and CO₂
    shows: generation by source at the operator's own time step, and CO₂ per kWh where the operator publishes it (country cards)
    cells:
      AT:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json, eu/day/*
        note: APG's transparency API answers the session with a reset; APG publishes no CO₂ per kWh
        checked: '2026-10-19'
      BE:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json, eu/day/*
        note: Elia's open data repeats the 15-min mix; no CO₂ per kWh found
        checked: '2026-10-19'
      BG:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json, eu/day/*
        note: the operator publishes no CO₂ per kWh; ENTSO-E carries its mix at the operator's step
        checked: '2026-10-19'
      HR:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json, eu/day/*
        note: the operator publishes no CO₂ per kWh; ENTSO-E carries its mix at the operator's step
        checked: '2026-10-19'
      CY:
        status: not_published
        url: https://tsoc.org.cy/electrical-system/total-daily-system-generation-on-the-transmission-system/
        note: Cyprus is not on the ENTSO-E platform; TSO Cyprus's generation pages answer scripts with HTTP 403
        checked: '2026-10-19'
      CZ:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json, eu/day/*
        note: the operator publishes no CO₂ per kWh; ENTSO-E carries its mix at the operator's step
        checked: '2026-10-19'
      DK:
        status: have
        source: Energinet Energi Data Service (5 min, CO₂)
        url: https://www.energidataservice.dk
        licence: CC BY 4.0
        dataset: eu/dk_live.json
        checked: '2026-10-18'
      EE:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json, eu/day/*
        note: Elering's dashboard API gives 15-min production and consumption, no CO₂ per kWh (checked)
        checked: '2026-10-19'
      FI:
        status: have
        source: ENTSO-E A75 actual generation per type
        url: https://transparency.entsoe.eu
        licence: ENTSO-E terms
        dataset: eu/stats.json
        note: Fingrid's 3-min data and its CO₂ per kWh need FINGRID_API_KEY (data.fingrid.fi)
        parts:
        - name: ENTSO-E mix
          status: have
          source: ENTSO-E
        - name: Fingrid 3 min and CO₂
