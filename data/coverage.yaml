# The coverage registry (brief 22): one cell per family x country. scripts/coverage.py renders
# docs/COVERAGE.md and frontend/public/data/eu/coverage.json and checks every cell.
families:
  connect:
    name: Room to connect
    shows: free grid capacity, hosting capacity or connection queues per substation, node or area (Grid capacity layer, site analysis)
    regions:
    - neighbours
    cells:
      AT:
        status: built
        licence: public notice; reuse with the source named
        source: APG, available connection capacities (monthly, EU 2019/943 Art. 50(4a))
        url: https://markt.apg.at/netz/netzanschluss/netzanschlusskapazitaeten/
        dataset: eu/connect/at.json, lake connect_eu/at, eu/connect/harmonised.json
        note: APG transmission substations (card); Energienetze Steiermark free feed-in capacity per substation (harmonised, positions by name); Netz NÖ's transformer map is a QGIS WMS (GetFeatureInfo per
          click, no table); Wiener Netze, Netz OÖ and Kärnten Netz publish no capacity file (2026-10-28)
        checked: '2026-10-28'
      BE:
        status: not_published
        url: https://www.elia.be/en/customers/connection/grid-hosting-capacity
        note: Elia and Sibelga answer HTTP 403 behind Cloudflare's check (2026-10-27); Elia's open-data portal holds no hosting-capacity set; Fluvius and ORES pages answer 404. Browser discovery in Actions
          (2026-10-28, an honest Chromium) did not pass the check.
        checked: '2026-10-28'
      BG:
        status: built
        licence: public notice; reuse with the source named
        source: ESO, electronic map of free capacity
        url: https://webapps.eso.bg/capacity/
        dataset: eu/connect/bg.json, lake connect_eu/bg
        checked: '2026-10-19'
      HR:
        status: built
        url: https://www.hops.hr/informacije-o-mogucnosti-prikljucenja
        note: HEP ODS map at kapaciteti.hep.hr (488 substations, kW shown in MW)
        source: HOPS, connection possibility per transmission substation (PDF, categories); HEP ODS, free capacity and pending applications per distribution substation (JSON behind its map)
        licence: HOPS website (public information)
        dataset: eu/connect/harmonised.json
        checked: '2026-10-28'
      CY:
        status: not_published
        url: https://www.eac.com.cy/EN/RegulatedActivities/Distribution/renewableenergy/Pages/hosting-capacity.aspx
        note: TSO Cyprus answers HTTP 403 behind Cloudflare; EAC's hosting-capacity page resets the connection (2026-10-27). Browser discovery in Actions (2026-10-28, an honest Chromium) did not pass the
          check.
        checked: '2026-10-28'
      CZ:
        status: built
        licence: public notice; reuse with the source named
        source: ČEPS, map of available capacity for connection (2031, 2036); PREdistribuce connectability map (harmonised)
        url: https://www.ceps.cz/cs/mapa-dostupne-kapacity-pro-pripojeni-k-ps
        dataset: eu/connect/cz.json, lake connect_eu/cz, eu/connect/harmonised.json
        checked: '2026-10-28'
        note: 'PREdistribuce (Prague): free capacity yes/no per 110 kV supply area (ArcGIS, no unit stated, so no MW); ČEZ Distribuce publishes a map without a data service found; EG.D answers 403 (maintenance
          page) (2026-10-28)'
      DK:
        status: built
        licence: public notice; reuse with the source named
        source: Energinet and the DSOs, kapacitetskort.dk
        url: http://www.kapacitetskort.dk
        dataset: eu/connect/dk.json, lake connect_eu/dk
        note: transmission and distribution stations
        checked: '2026-10-19'
      EE:
        status: built
        licence: public notice; reuse with the source named
        source: Elering e-Gridmap
        url: https://vla.elering.ee/
        dataset: eu/connect/ee.json, lake connect_eu/ee
        note: expandable or not and extra fee; no MW published
        checked: '2026-10-19'
      FI:
        status: built
        url: https://www.elenia.fi/en/electricity-consumption-and-production/green-transition/map-of-available-capacity
        note: 'Fingrid''s Verkkokiikari is a map without a download; Caruna publishes no capacity map; four small DSOs (Rejlers-hosted maps: K-Sat, Nivos, Naantalin Energia, Lehtimäki) publish MVA bands
          without a side, not harmonised (2026-10-28)'
