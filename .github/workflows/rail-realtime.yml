name: Record rail real-time

# Records the gtfs.de GTFS-Realtime feed (rail trips only) every 15 minutes into
# rail-rt/<service date>.json.gz on the `rail-data` branch
# (scripts/record_rail_realtime.py).
#
# GitHub starts scheduled runs late or not at all under load (a */15 schedule
# ran only every 4-6 h here), so timing is not left to cron: each run stays up
# for ~5 h 45 min and takes a snapshot every 15 min itself. The hourly schedule
# only has to fire once in that window; while a run is active, the next one
# waits in the concurrency queue and takes over when it ends.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rail-realtime
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx gtfs-realtime-bindings

      - name: Fetch recorded days
        run: |
          mkdir -p store
          if git ls-remote --exit-code origin rail-data >/dev/null; then
            git fetch --depth 1 origin rail-data
            git --work-tree=store checkout FETCH_HEAD -- .
          fi

      - name: Record every 15 min for ~5 h 45 min
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          end=$((SECONDS + 20700))
          while [ "$SECONDS" -lt "$end" ]; do
            started=$SECONDS
            if python scripts/record_rail_realtime.py --out store/rail-rt; then
              (
                cd store
                rm -rf .git
                git init -q -b rail-data
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -q -m "rail real-time snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -q -f "$REMOTE" rail-data
              ) || echo "push failed; next snapshot retries"
            else
              echo "snapshot failed; retrying next round"
            fi
            wait=$((900 - (SECONDS - started)))
            if [ "$wait" -gt 0 ] && [ $((SECONDS + wait)) -lt "$end" ]; then sleep "$wait"; else break; fi
          done
