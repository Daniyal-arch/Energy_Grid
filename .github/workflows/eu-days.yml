name: Europe day archive

# Keeps a rolling archive of complete days for the 24-hours view
# (scripts/build_eu_day.py --recent, from ENTSO-E): every morning (07:23 UTC, when the
# late TSOs have sent yesterday's last hours) it builds yesterday, rebuilds the
# two newest days to pick up late corrections, and drops days older than the window.
# The archive lives on the `eu-days` branch (eu/day/<date>.json + index.json); the app
# reads it from raw.githubusercontent.com next to the days bundled with the site.
#
# First run / backfill: Actions -> "Europe day archive" -> Run workflow (days = 30).

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many complete days to keep"
        default: "30"

permissions:
  contents: write

concurrency:
  group: eu-days
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx python-dotenv tzdata

      - name: Fetch the current archive
        run: |
          mkdir -p store
          if git ls-remote --exit-code origin eu-days >/dev/null; then
            git fetch --depth 1 origin eu-days
            git --work-tree=store checkout FETCH_HEAD -- .
          fi
          mkdir -p store/eu/day

      - name: Build missing days
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/build_eu_day.py --recent "${{ github.event.inputs.days || '30' }}" --out store/eu/day

      - name: Output per plant (ENTSO-E per unit; the last 8 days, so late publishers fill in)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/build_eu_units.py --recent 8 --out store/eu/units || echo "unit output failed; keeping the last copies"

      - name: US fossil plants hour by hour (EPA CAMPD; the newest complete quarter's last 7 days)
        env:
          # sent as the X-Api-Key header, never in a URL (api.data.gov key)
          EPA_API_KEY: ${{ secrets.EPA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          pip install openpyxl tzfpy
          if python scripts/build_us_units.py --recent 7 --out store/eu/usunits; then
            # the US replay's day files for those dates (months back; kept by build_us_day's pruning)
            missing=$(cd store/eu/usunits && for f in ????-??-??.json; do [ -f "../usday/$f" ] || echo "${f%.json}"; done)
            [ -z "$missing" ] || python scripts/build_us_day.py $missing --out store/eu/usday || echo "US days for the plant files failed"
          else
            echo "EPA CAMPD failed; keeping the last copies"
          fi

      - name: The US day by day (EIA-930 and hub prices; three days back, 30 kept)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python scripts/build_us_day.py --recent 30 --out store/eu/usday || echo "US days failed; keeping the last copies"

      - name: US day-ahead prices at one hub per market (today and tomorrow; hub prices into days built without)
        env:
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: |
          python scripts/fetch_us_prices.py --out store/eu || echo "US prices failed; keeping the last copy"
          python scripts/build_us_day.py --prices-only --out store/eu/usday || echo "US day prices failed"

      - name: Twelve months of prices per zone (Prices tab)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/build_prices.py --out store/eu || echo "prices failed; keeping yesterday's"

      - name: World figures (World Bank access, OpenStreetMap data centres)
        run: |
          pip install shapely
          curl -sL -o data_gisco.geojson https://gisco-services.ec.europa.eu/distribution/v2/countries/geojson/CNTR_RG_20M_2024_4326.geojson || true
          mkdir -p data/eu && mv data_gisco.geojson data/eu/countries.geojson || true
          python scripts/fetch_world.py --out store/eu || echo "world fetch failed; keeping the last copy"
          python scripts/fetch_cables.py --out store/eu || echo "cables fetch failed; keeping the last copy"
          # installed capacity per country and technology (IRENA, twice-yearly releases)
          python scripts/fetch_irena.py --out store/eu || echo "IRENA fetch failed; keeping the last copy"

      - name: Gas flows per gas day (ENTSOG, no key; newest complete gas day and 30 before)
        run: python scripts/fetch_entsog.py --out store/eu || echo "ENTSOG fetch failed; keeping yesterday's"

      - name: LNG send-out per terminal (GIE ALSI, the last 30 gas days)
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python scripts/fetch_alsi.py --out store/eu || echo "ALSI fetch failed; keeping yesterday's"

      - name: EU ETS verified CO2 per installation (Union Registry + EEA register; Mondays)
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ ! -f store/eu/ets.json ]; then
            python scripts/fetch_eu_ets.py --out store/eu || echo "EU ETS fetch failed; keeping the last copy"
          fi

      - name: What consumers pay (Eurostat half-yearly, EIA monthly; Mondays)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ ! -f store/eu/retail.json ]; then
            python scripts/fetch_retail_prices.py --out store/eu || echo "retail prices failed; keeping the last copy"
          fi

      - name: Wind for the same days (Open-Meteo, one pass over the window)
        run: python scripts/fetch_wind.py --recent "${{ github.event.inputs.days || '30' }}" --out store/eu/wind || echo "wind fetch failed"

      - name: Publish
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd store
          rm -rf .git
          git init -q -b eu-days
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Europe day archive $(date -u +%Y-%m-%d)"
          git push -q -f "$REMOTE" eu-days
