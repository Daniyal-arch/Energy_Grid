name: Europe day archive

# Keeps a rolling archive of complete days for the 24-hours view
# (scripts/build_eu_day.py --recent, from ENTSO-E): every morning (07:23 UTC, when the
# late TSOs have sent yesterday's last hours) it builds yesterday, rebuilds the
# two newest days to pick up late corrections, and drops days older than the window.
# The archive lives on the `eu-days` branch (eu/day/<date>.json + index.json); the app
# reads it from raw.githubusercontent.com next to the days bundled with the site.
#
# First run / backfill: Actions -> "Europe day archive" -> Run workflow (days = 30).

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many complete days to keep"
        default: "30"

permissions:
  contents: write

concurrency:
  group: eu-days
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # each data step has its own budget and never stops the others: a slow source on a bad day
    # (ENTSO-E per unit took over 100 minutes on 2026-10-17) cannot keep the day's files from Publish
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx python-dotenv tzdata

      - name: Fetch the current archive
        run: |
          mkdir -p store
          if git ls-remote --exit-code origin eu-days >/dev/null; then
            git fetch --depth 1 origin eu-days
            git --work-tree=store checkout FETCH_HEAD -- .
          fi
          mkdir -p store/eu/day

      - name: Build missing days
        timeout-minutes: 35
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/build_eu_day.py --recent "${{ github.event.inputs.days || '30' }}" --out store/eu/day

      - name: Output per plant (ENTSO-E per unit; the last 8 days, so late publishers fill in)
        timeout-minutes: 30
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/build_eu_units.py --recent 8 --out store/eu/units || echo "unit output failed; keeping the last copies"

      - name: US fossil plants hour by hour (EPA CAMPD; the newest complete quarter's last 7 days)
        timeout-minutes: 15
        continue-on-error: true
        env:
          # sent as the X-Api-Key header, never in a URL (api.data.gov key)
          EPA_API_KEY: ${{ secrets.EPA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          pip install openpyxl tzfpy
          if python scripts/build_us_units.py --recent 7 --out store/eu/usunits; then
            # the US replay's day files for those dates (months back; kept by build_us_day's pruning)
            missing=$(cd store/eu/usunits && for f in ????-??-??.json; do [ -f "../usday/$f" ] || echo "${f%.json}"; done)
            [ -z "$missing" ] || python scripts/build_us_day.py $missing --out store/eu/usday || echo "US days for the plant files failed"
          else
            echo "EPA CAMPD failed; keeping the last copies"
          fi

      - name: The US day by day (EIA-930 and hub prices; three days back, 30 kept)
        timeout-minutes: 10
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python scripts/build_us_day.py --recent 30 --out store/eu/usday || echo "US days failed; keeping the last copies"

      - name: US day-ahead prices at one hub per market (today and tomorrow; hub prices into days built without)
        timeout-minutes: 5
        continue-on-error: true
        env:
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: |
          python scripts/fetch_us_prices.py --out store/eu || echo "US prices failed; keeping the last copy"
          pip install gridstatus
          python scripts/fetch_us_rt.py --out store/eu || echo "US real-time prices failed; keeping the last copy"
          python scripts/build_us_day.py --prices-only --out store/eu/usday || echo "US day prices failed"

      - name: US prices at every node (six markets, CAISO nodes placed; missing days newest first, 8 a run, 30 kept)
        timeout-minutes: 25
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install gridstatus duckdb pycountry
          python scripts/fetch_us_nodes.py --recent 30 --max 8 --out store/eu/us_nodes --lake lake-out --upload || echo "US node prices failed; keeping the last copies"

      - name: Twelve months of prices per zone (Prices tab)
        timeout-minutes: 15
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python scripts/build_prices.py --out store/eu || echo "prices failed; keeping yesterday's"
          # Great Britain (Elexon market index, ECB rate), merged in after each monthly rebuild
          python scripts/build_gb_prices.py --out store/eu || echo "GB prices failed; keeping yesterday's"

      - name: Imbalance prices per zone (ENTSO-E A85, the last 30 days)
        timeout-minutes: 15
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/build_imbalance.py --out store/eu || echo "imbalance failed; keeping yesterday's"

      - name: Lines out of service (ENTSO-E A78; skipped while a Lake ENTSO-E run is active)
        timeout-minutes: 30
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install duckdb pycountry
          if bash scripts/entsoe_idle.sh 0; then
            python scripts/build_transmission_outages.py --out store/eu || echo "A78 failed; keeping yesterday's"
          fi

      - name: Redispatch, countertrading, congestion costs (ENTSO-E A63/A91/A92), GB constraints (NESO), CAISO curtailment
        timeout-minutes: 40
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb pycountry openpyxl
          [ -f store/eu/congestion.json ] || cp frontend/public/data/eu/congestion.json store/eu/
          what=all
          bash scripts/entsoe_idle.sh 0 || what="gb caiso"
          for w in $what; do python scripts/build_congestion.py $w --days 35 --out store/eu --lake lake-out --upload || echo "$w failed; keeping yesterday's"; done

      - name: Japan and Mexico day-ahead prices (JEPX, CENACE)
        timeout-minutes: 20
        continue-on-error: true
        run: |
          pip install openpyxl
          python scripts/build_markets.py jepx --out store/eu || echo "JEPX failed; keeping yesterday's"
          python scripts/build_markets.py cenace --out store/eu || echo "CENACE failed; keeping yesterday's"

      - name: World figures (World Bank access, OpenStreetMap data centres)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          pip install shapely
          curl -sL -o data_gisco.geojson https://gisco-services.ec.europa.eu/distribution/v2/countries/geojson/CNTR_RG_20M_2024_4326.geojson || true
          mkdir -p data/eu && mv data_gisco.geojson data/eu/countries.geojson || true
          python scripts/fetch_world.py --out store/eu || echo "world fetch failed; keeping the last copy"
          python scripts/fetch_cables.py --out store/eu || echo "cables fetch failed; keeping the last copy"
          # installed capacity per country and technology (IRENA, twice-yearly releases)
          python scripts/fetch_irena.py --out store/eu || echo "IRENA fetch failed; keeping the last copy"

      - name: Gas flows per gas day (ENTSOG, no key; newest complete gas day and 30 before)
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/fetch_entsog.py --out store/eu || echo "ENTSOG fetch failed; keeping yesterday's"

      - name: LNG send-out per terminal (GIE ALSI, the last 30 gas days)
        timeout-minutes: 5
        continue-on-error: true
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python scripts/fetch_alsi.py --out store/eu || echo "ALSI fetch failed; keeping yesterday's"

      - name: EU ETS and UK ETS verified CO2 per installation (Union Registry + EEA register, UK ETS registry; Mondays)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ ! -f store/eu/ets.json ]; then
            python scripts/fetch_eu_ets.py --out store/eu || echo "EU ETS fetch failed; keeping the last copy"
            python scripts/fetch_uk_ets.py --out store/eu || echo "UK ETS fetch failed; GB keeps its last rows"
          fi

      - name: What consumers pay (Eurostat half-yearly, DESNZ for GB, EIA monthly; Mondays)
        timeout-minutes: 5
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ ! -f store/eu/retail.json ]; then
            python scripts/fetch_retail_prices.py --out store/eu || echo "retail prices failed; keeping the last copy"
            python scripts/fetch_gb_retail.py --out store/eu || echo "GB retail prices (DESNZ) failed; GB left out this week"
          fi

      - name: Power cuts, SAIDI and SAIFI (World Bank; on the 1st of the month)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          if [ "$(date -u +%d)" = 01 ] || [ ! -f store/eu/reliability.json ]; then
            python scripts/fetch_reliability.py --out store/eu || echo "reliability failed; keeping the last copy"
          fi

      - name: Emissions per facility worldwide (Climate TRACE; on the 1st of the month)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if [ "$(date -u +%d)" = 01 ] || [ ! -f store/eu/ctrace.json ]; then
            python scripts/fetch_climate_trace.py --out store/eu || echo "Climate TRACE failed; keeping the last copy"
          fi

      - name: Grid capacity GB, NL, ES (NESO TEC register, Dutch capacity map, REE nodes; Mondays)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          pip install openpyxl shapely
          if [ "$(date -u +%u)" = 1 ] || [ ! -f store/eu/connect.json ]; then
            python scripts/fetch_connect_here.py --out store/eu || echo "grid capacity failed; keeping the last copy"
          fi

      - name: Wind for the same days (Open-Meteo, one pass over the window)
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/fetch_wind.py --recent "${{ github.event.inputs.days || '30' }}" --out store/eu/wind || echo "wind fetch failed"

      - name: Lake (scripts/build_lake_datasets.py; never blocks the map's files)
        timeout-minutes: 20
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb openpyxl pycountry shapely
          run() { python scripts/build_lake_datasets.py "$@" --lake lake-out --tmp /tmp/lake-tmp --upload || echo "lake $1 failed"; }
          run entsog --recent 7
          run eia930 --recent 3
          run irena
          if [ "$(date -u +%u)" = 1 ]; then run euets; run connect; fi
          if [ "$(date -u +%d)" = 01 ]; then run osm --store store/eu; fi

      - name: Publish
        if: ${{ !cancelled() }}
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd store
          rm -rf .git
          git init -q -b eu-days
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Europe day archive $(date -u +%Y-%m-%d)"
          git push -q -f "$REMOTE" eu-days
