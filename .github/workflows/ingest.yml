# Cloud ingestion — runs on GitHub's servers, so your PC can be off.
# Trigger manually (Actions tab → "ingest" → Run workflow) or on the weekly schedule.
# The GEE backfill is checkpointed + resumable, so if a run hits the 6h job limit the
# next run continues via --skip-existing.
name: ingest

on:
  workflow_dispatch:
    inputs:
      source:
        description: "adapter (gee | brightsky | …)"
        default: "gee"
      technology:
        description: "subset by technology (satellite is solar-only; blank = all — avoid)"
        default: "solar"
      mastr_status:
        description: 'registry status (e.g. "In Planung"; blank = all)'
        default: "In Planung"
      since:
        description: "backfill start date"
        default: "2021-01-01"
      batch_size:
        description: "sites per checkpoint"
        default: "15"
      skip_existing:
        description: "skip sites already backfilled"
        type: boolean
        default: true
      run_detection:
        description: "run detection after backfill"
        type: boolean
        default: true
  # Phase 2: weekly keep-up run (incremental, resumable)
  # schedule:
  #   - cron: "0 5 * * 1"   # Mondays 05:00 UTC

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # just under GitHub's 6h job limit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-packages

      # secrets/runner contexts are only available at STEP level, not job level
      - name: Write GEE service-account key
        if: ${{ inputs.source == 'gee' }}
        run: printf '%s' "$GEE_JSON" > /tmp/gee-key.json
        env:
          GEE_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}

      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_SERVICE_ACCOUNT_KEY_FILE: /tmp/gee-key.json
        run: |
          args=(--source "${{ inputs.source }}" --since "${{ inputs.since }}" \
                --batch-size "${{ inputs.batch_size }}")
          if [ -n "${{ inputs.technology }}" ]; then args+=(--technology "${{ inputs.technology }}"); fi
          if [ -n "${{ inputs.mastr_status }}" ]; then args+=(--mastr-status "${{ inputs.mastr_status }}"); fi
          if [ "${{ inputs.skip_existing }}" = "true" ]; then args+=(--skip-existing); fi
          echo "running: ingestion.run ${args[*]}"
          uv run python -m ingestion.run "${args[@]}"

      - name: Detection
        if: ${{ inputs.run_detection }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          args=()
          if [ -n "${{ inputs.technology }}" ]; then args+=(--technology "${{ inputs.technology }}"); fi
          if [ -n "${{ inputs.mastr_status }}" ]; then args+=(--mastr-status "${{ inputs.mastr_status }}"); fi
          uv run python -m ingestion.detect "${args[@]}"
