name: Browser fetch

# Files whose sites answer scripts with a browser check (Cloudflare "Just a moment..."):
# scripts/browser_fetch.py opens each source's page in Chromium (headed, under xvfb), downloads
# the file, keeps it in the private bucket (r2://infraatlas-raw/sources/<name>/) and runs the
# source's build when the file changed. If the browser is refused too, a file the owner uploads
# to r2://infraatlas-raw/sources/<name>/manual/ is used instead (see the script's docstring).
# Monthly, and by hand: Actions > Browser fetch > Run workflow. A new source is one entry in
# SOURCES in scripts/browser_fetch.py.
# Needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: "23 6 3 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Source names, space-separated (empty: all)"
        type: string
        default: ""
      force:
        description: "Build even if the file did not change"
        type: boolean
        default: false
  push:
    branches: [claude/busy-fermat-nodvwe]
    paths: [.github/workflows/browser-fetch.yml, scripts/browser_fetch.py]

permissions:
  contents: write

concurrency:
  group: browser-fetch-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          pip install playwright httpx duckdb pycountry openpyxl
          python -m playwright install --with-deps chromium
          bash scripts/r2_creds.sh
      - name: Fetch, keep in R2, build what changed
        run: |
          args="${{ inputs.sources }}"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          [ "${{ github.event_name }}" = "push" ] && args="$args --force"
          xvfb-run -a python scripts/browser_fetch.py $args
      - name: Commit outputs
        if: ${{ !cancelled() }}
        run: bash scripts/wave5_commit.sh "Browser fetch: rebuilt files"
