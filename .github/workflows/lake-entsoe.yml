name: Lake ENTSO-E

# ENTSO-E history in the lake (docs/DATA_LAKE.md section 6, docs/DATA_SOURCES.md "Lake:
# ENTSO-E"): prices, load, generation, wind and solar forecasts, flows, output per unit,
# installed capacity, transfer capacity and outages, 2015 to yesterday, as Parquet in
# r2://infraatlas-raw/lake/entsoe/ (scripts/build_lake_entsoe.py).
#
# Backfill: Actions > Lake ENTSO-E > Run workflow, `years` = "2015-2025" or "2019,2020": one
# job per year, a few at a time (ENTSO-E allows 400 requests a minute per key, shared with the
# map's own workflows). Daily after eu-days: the last three days of the current year are
# fetched again and that year's files rewritten. A last job merges the catalogue.
# Needs ENTSOE_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: "41 4 * * *" # after eu-days
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to backfill: "2015-2025" or "2019,2020" (empty: the recent days)'
        type: string
        default: ""
      probe:
        description: "Run the API probe (scripts/probe_lake_entsoe.py) first"
        type: boolean
        default: false
  push:
    branches: [main, claude/lake-entsoe]
    paths: [.github/workflows/lake-entsoe.yml, scripts/build_lake_entsoe.py, scripts/probe_lake_entsoe.py]

permissions:
  contents: read

concurrency:
  group: lake-entsoe-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.probe || (github.event_name == 'push' && github.ref_name != 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe the API
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          pip install httpx python-dotenv
          python scripts/probe_lake_entsoe.py | tee probe.txt
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
