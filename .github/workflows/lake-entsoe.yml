name: Lake ENTSO-E

# ENTSO-E history in the lake (docs/DATA_LAKE.md section 6, docs/DATA_SOURCES.md "Lake:
# ENTSO-E"): prices, load, generation, wind and solar forecasts, flows, output per unit,
# installed capacity, transfer capacity and outages, 2015 to yesterday, as Parquet in
# r2://infraatlas-raw/lake/entsoe/ (scripts/build_lake_entsoe.py).
#
# Backfill: Actions > Lake ENTSO-E > Run workflow, `years` = "2015-2025" or "2019,2020": one
# job per year, one at a time: ENTSO-E throttles one key to ~100 requests a minute in practice
# (three years at once ran at 38/min each with thousands of 429s and none finished within the
# 350-minute job limit, run 39020225322; 2024 alone took 2 h 49 min). Daily after eu-days: the last three days of the current year are
# fetched again and that year's files rewritten. A last job merges the catalogue.
# On a branch (before the workflow is on main, where Run workflow appears) a push runs the
# years and tables its commit message names: "[years: 2015-2023]" "[tables: capacity]".
# Needs ENTSOE_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: "41 4 * * *" # after eu-days
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to backfill: "2015-2025" or "2019,2020" (empty: the recent days)'
        type: string
        default: ""
      probe:
        description: "Run the API probe (scripts/probe_lake_entsoe.py) first"
        type: boolean
        default: false
  push:
    branches: [main, claude/wrap-up]
    paths: [.github/workflows/lake-entsoe.yml, scripts/build_lake_entsoe.py, scripts/probe_lake_entsoe.py]

permissions:
  contents: read

concurrency:
  group: lake-entsoe-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe the API
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          pip install httpx python-dotenv
          set -o pipefail
          PROBE_FROM=2 python scripts/probe_lake_entsoe.py | tee probe.txt
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.p.outputs.years }}
      tables: ${{ steps.p.outputs.tables }}
    steps:
      - id: p
        name: Which years
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          event, raw, ref = os.environ["EVENT"], os.environ["YEARS"].strip(), os.environ["REF"]
          years = []
          if raw:
              for part in raw.split(","):
                  a, _, b = part.strip().partition("-")
                  years += list(range(int(a), int(b or a) + 1))
          elif event == "push" and ref != "main":
              # a branch push runs the years its commit names: "[years: 2015-2026]"
              import re
              m = re.search(r"\[years: ([0-9, -]+)\]", os.environ["MESSAGE"])
              for part in (m.group(1).split(",") if m else []):
                  a, _, b = part.strip().partition("-")
                  years += list(range(int(a), int(b or a) + 1))
          print("years=" + json.dumps(years))
          # "[tables: capacity,outages]" in a branch commit: only those tables
          t = re.search(r"\[tables: ([a-z_, ]+)\]", os.environ.get("MESSAGE", "")) if event == "push" else None
          print("tables=" + (",".join(x.strip() for x in t.group(1).split(",")) if t else ""))
          PY
        env:
          EVENT: ${{ github.event_name }}
          YEARS: ${{ inputs.years || '' }}
          REF: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message || '' }}

  year:
    needs: plan
    if: ${{ needs.plan.outputs.years != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch the year, write and upload its files
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb httpx python-dotenv pycountry
          tables="${{ needs.plan.outputs.tables }}"
          python scripts/build_lake_entsoe.py --year ${{ matrix.year }} ${tables:+--tables $tables} --workers 10 --lake lake-out --tmp /tmp/entsoe --upload
          mkdir -p part && cp lake-out/entsoe/_catalog.json part/catalog-${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: entsoe-catalog-${{ matrix.year }}
          path: part/
          retention-days: 5

  dims:
    needs: plan
    if: ${{ needs.plan.outputs.years != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Areas and units
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb httpx python-dotenv pycountry
          python scripts/build_lake_entsoe.py --dims --lake lake-out --tmp /tmp/entsoe --upload
          mkdir -p part && cp lake-out/entsoe/_catalog.json part/catalog-dims.json
      - uses: actions/upload-artifact@v4
        with:
          name: entsoe-catalog-dims
          path: part/
          retention-days: 5

  merge:
    needs: [plan, year, dims]
    if: ${{ !cancelled() && needs.plan.outputs.years != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: entsoe-catalog-*
          path: part
          merge-multiple: true
      - name: One catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb httpx python-dotenv pycountry
          python scripts/build_lake_entsoe.py --merge part/catalog-*.json --lake lake-out --upload | tee -a "$GITHUB_STEP_SUMMARY"

  recent:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.years == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The last three days again, the year's files rewritten
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb httpx python-dotenv pycountry
          python scripts/build_lake_entsoe.py --recent 3 --workers 8 --lake lake-out --tmp /tmp/entsoe --upload
