name: Wrap-up branch test (temporary, removed before the PR)

# Runs the new steps of docs/tasks/16-wrap-up.md on the session's branch and commits their small
# outputs back to it. A push runs the parts its commit message names: "[run: imbalance, ev, atlas]".

on:
  push:
    branches: [claude/wrap-up]

permissions:
  contents: write

jobs:
  test:
    if: contains(github.event.head_commit.message, '[run:')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MSG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx python-dotenv tzdata duckdb pycountry
      - name: Imbalance prices (probe, then the eu-days step)
        if: contains(github.event.head_commit.message, 'imbalance')
        timeout-minutes: 30
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          mkdir -p probe-out
          if [ ! -f probe-out/imbalance_probe.txt ]; then python scripts/probe_entsoe_imbalance.py 2>&1 | tee probe-out/imbalance_probe.txt; fi
          python scripts/build_imbalance.py --out frontend/public/data/eu 2>&1 | tee probe-out/imbalance_build.txt
      - name: GB carbon intensity and Denmark every 5 minutes (the eu-snapshot loop's commands)
        if: contains(github.event.head_commit.message, 'live')
        continue-on-error: true
        run: |
          mkdir -p probe-out/live
          python scripts/fetch_gb_carbon.py --out probe-out/live 2>&1 | tee probe-out/live_gb.txt
          python scripts/fetch_dk_live.py --out probe-out/live 2>&1 | tee probe-out/live_dk.txt

      - name: EV fast chargers (probe, then the us-grid step)
        if: contains(github.event.head_commit.message, ' ev')
        timeout-minutes: 30
        continue-on-error: true
        env:
          NREL_API_KEY: ${{ secrets.NREL_API_KEY || secrets.EPA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p probe-out
          python scripts/probe_nrel_afdc.py 2>&1 | tee probe-out/afdc_probe.txt
          python scripts/fetch_ev_chargers.py --lake lake-out --tmp /tmp/afdc --upload 2>&1 | tee probe-out/afdc_build.txt
          cp lake-out/afdc/_catalog.json probe-out/afdc_catalog.json || true
      - name: lake/atlas/_catalog.json from the files on R2 (the first atlas run listed none)
        if: contains(github.event.head_commit.message, 'atlas-catalog')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          verify() { curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["id"])'; }
          id=$(verify https://api.cloudflare.com/client/v4/user/tokens/verify || verify "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" || true)
          secret=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          export AWS_ACCESS_KEY_ID="$id" AWS_SECRET_ACCESS_KEY="$secret" AWS_DEFAULT_REGION=auto
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import UTC, datetime
          ep = f"https://{os.environ['CLOUDFLARE_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          def size(bucket, key):
              out = subprocess.run(["aws", "s3api", "head-object", "--endpoint-url", ep, "--bucket", bucket, "--key", key], capture_output=True, text=True, check=True).stdout
              return json.loads(out)["ContentLength"]
          meta = json.load(open("frontend/public/data/eu/atlas.json"))
          rasters = {}
          for var, f in (("pvout", "atlas-pvout"), ("wind", "atlas-wind100")):
              rasters[f] = {
                  "path": f"lake/atlas/{f}.tif",
                  "bytes": size("infraatlas-raw", f"lake/atlas/{f}.tif"),
                  "format": "Cloud-Optimized GeoTIFF",
                  "tiles": f"grid/{f}.pmtiles",
                  "tiles_bytes": size("infraatlas-data", f"grid/{f}.pmtiles"),
                  "lookup": f"grid/{f}-0.1deg.i16",
                  "lookup_bytes": size("infraatlas-data", f"grid/{f}-0.1deg.i16"),
                  "lookup_meta": {k: v for k, v in meta[var]["lookup"].items() if k != "url"},
                  "title": meta[var]["title"], "unit": meta[var]["unit"], "source": meta[var]["source"],
              }
          cat = {"dataset": "atlas", "source": "Global Solar Atlas (World Bank, Solargis); Global Wind Atlas 3 (DTU)",
                 "licence": "CC BY 4.0", "script": "scripts/build_atlas.py",
                 "updated": datetime.now(UTC).isoformat(timespec="seconds"), "tables": {}, "rasters": rasters}
          json.dump(cat, open("_catalog.json", "w"), indent=1)
          os.makedirs("probe-out", exist_ok=True)
          json.dump(cat, open("probe-out/atlas_catalog.json", "w"), indent=1)
          print(json.dumps(cat, indent=1))
          PY
          npx --yes wrangler@4 r2 object put infraatlas-raw/lake/atlas/_catalog.json --file _catalog.json --content-type application/json --remote

      - name: Commit the outputs to the branch
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe-out frontend/public/data
          git commit -q -m "Wrap-up test outputs $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin claude/wrap-up && git push -q origin HEAD:claude/wrap-up && break; sleep 5; done
