name: Zoning

# Zoning and land-use plans into the lake (scripts/build_zoning.py, docs/research/zoning.md):
# Actions > Zoning > Run workflow with the sources ("all" or "fr_gpu,ie_myplan"). One source at
# a time, because the sources share the zoning catalogue. Needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "all, or a list of fr_gpu, ie_myplan, dk_plandata, fi_helsinki, us_ca, gb_england"
        type: string
        default: all
      discover:
        description: "also run the discovery sweeps (data.europa.eu, ArcGIS Hub) and keep their CSVs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.p.outputs.sources }}
    steps:
      - id: p
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          allsrc = ["ie_myplan", "dk_plandata", "fi_helsinki", "gb_england", "us_ca", "fr_gpu"]
          raw = os.environ["SOURCES"].strip()
          pick = allsrc if raw in ("", "all") else [s.strip() for s in raw.split(",") if s.strip()]
          print("sources=" + json.dumps(pick))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: ${{ fromJson(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ${{ matrix.source }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install duckdb httpx
          set -o pipefail
          cd scripts && python build_zoning.py ${{ matrix.source }} --lake ../lake-out --tmp /tmp/zoning --upload 2>&1 | tail -n 60

  discover:
    if: ${{ inputs.discover }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install httpx
          python scripts/zoning_discover.py --pages 50 --out discovery
          python scripts/zoning_discover.py --hub --step 2 --pages 10 --out discovery
      - uses: actions/upload-artifact@v4
        with:
          name: zoning-discovery
          path: discovery/
