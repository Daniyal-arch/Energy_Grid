name: Wave 8 datasets

# The builds of brief 27 (docs/tasks/27-any-area-wave8.md): outlines at every level (O), the
# rasters area_stats reads (R: GHSL tiles; S: 1 km class shares of WorldCover and slope, then M
# their mosaic), energy figures per small area (C), asset layers (A), the probes (P) and the
# in_area timing from a Lambda-sized container (T). Outputs: lake tables and COGs on R2 (private
# bucket infraatlas-raw), small app files committed back to the branch. Run by hand naming the
# groups, or from a branch push whose commit message holds "[w8: O R ...]" (while building).
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (uploads), the R2 read keys (T), and
# optionally FIRMS_MAP_KEY and CENSUS_API_KEY (skipped, and said so, when missing).

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Groups (O R S M C A P T)"
        type: string
        default: "O R S M C A P"
  push:
    branches: ["claude/**"]

permissions:
  contents: write

env:
  GROUPS: ${{ inputs.groups || github.event.head_commit.message }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.p.outputs.groups }}
      rvars: ${{ steps.p.outputs.rvars }}
    steps:
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          g = os.environ["GROUPS"]
          m = re.search(r"\[w8: ([A-Z ]+)\]", g)
          groups = m.group(1) if m else g if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" else ""
          words = groups.split()
          rvars = ["pop", "built"] if "R" in words else [v for v in ("pop", "built") if f"R{v}" in words]
          print("groups=" + groups)
          print("rvars=" + str(rvars).replace("'", '"'))
          PY

  O:
    needs: plan
    if: contains(needs.plan.outputs.groups, 'O')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install httpx duckdb pycountry
      - name: Outline sets (each continues when one fails)
        working-directory: scripts
        run: |
          for s in us nl uk fr adm2 ucdb grid national divisions; do
            python build_outlines.py "$s" --lake ../lake-out --upload || echo "::warning::outline set $s failed"
          done
          python build_outlines.py names --lake ../lake-out --upload

  R:
    needs: plan
    if: needs.plan.outputs.rvars != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        var: ${{ fromJSON(needs.plan.outputs.rvars) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin && pip install httpx
      - run: bash scripts/r2_creds.sh
      - name: GHSL ${{ matrix.var }} (3 arc-second tiles of the 29 places, 30 arc-second world)
        working-directory: scripts
        run: python build_rasters.py ghsl ${{ matrix.var }} --upload

  S:
    needs: plan
    if: contains(needs.plan.outputs.groups, 'S')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        job: ["worldcover 1/12", "worldcover 2/12", "worldcover 3/12", "worldcover 4/12", "worldcover 5/12", "worldcover 6/12",
              "worldcover 7/12", "worldcover 8/12", "worldcover 9/12", "worldcover 10/12", "worldcover 11/12", "worldcover 12/12",
              "slope 1/6", "slope 2/6", "slope 3/6", "slope 4/6", "slope 5/6", "slope 6/6"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install httpx rasterio numpy
      - id: n
        run: |
          set -- ${{ matrix.job }}
          echo "name=$1" >> "$GITHUB_OUTPUT"; echo "band=$2" >> "$GITHUB_OUTPUT"; echo "tag=$1-${2//\//of}" >> "$GITHUB_OUTPUT"
      - working-directory: scripts
        run: python build_rasters.py shares ${{ steps.n.outputs.name }} --band ${{ steps.n.outputs.band }}
      - uses: actions/upload-artifact@v4
        with:
          name: shares-${{ steps.n.outputs.tag }}
          path: /tmp/wave8/rasters/${{ steps.n.outputs.name }}_pieces
          retention-days: 3

  M:
    needs: [plan, S]
    if: always() && contains(needs.plan.outputs.groups, 'M')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        name: [worldcover, slope]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin && pip install httpx
      - run: bash scripts/r2_creds.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: shares-${{ matrix.name }}-*
          path: /tmp/wave8/rasters/${{ matrix.name }}_pieces
          merge-multiple: true
      - working-directory: scripts
        run: python build_rasters.py mosaic ${{ matrix.name }} --upload

  C:
    needs: plan
    if: contains(needs.plan.outputs.groups, 'C')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install httpx duckdb pycountry openpyxl
      - name: Energy figures per small area (each source on its own)
        working-directory: scripts
        run: python build_small_area_energy.py all --lake ../lake-out --upload
      - uses: actions/upload-artifact@v4
        with: {name: small-area-energy-status, path: /tmp/wave8/energy/status.json}

  P:
    needs: plan
    if: contains(needs.plan.outputs.groups, 'P')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install httpx
      - run: python scripts/probe_wave8.py all | tee -a "$GITHUB_STEP_SUMMARY"

  T:
    needs: plan
    if: contains(needs.plan.outputs.groups, 'T')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_READ_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_READ_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: in_area timing in a container sized like the Lambda (2 vCPU, 3,008 MB)
        run: |
          docker run --rm --cpus 2 --memory 3008m -v "$PWD:/w" -w /w/backend \
            -e R2_ACCOUNT_ID -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY -e AGENT_MODEL=fake \
            ghcr.io/astral-sh/uv:python3.12-bookworm sh -c '
              uv sync --frozen -q &&
              uv run python -c "import duckdb; c = duckdb.connect(); [c.install_extension(e) for e in (\"httpfs\", \"spatial\")]; c.install_extension(\"h3\", repository=\"community\")" &&
              uv run python probes/probe_in_area_timing.py &&
              curl -s -o /tmp/t.zip https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_4326_3ss/V1-0/tiles/GHS_POP_E2025_GLOBE_R2023A_4326_3ss_V1_0_R4_C20.zip &&
              curl -s -o /tmp/nuts.geojson https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_01M_2024_4326_LEVL_1.geojson &&
              cd /tmp && python3 -m zipfile -e t.zip t && cd /w/backend &&
              uv run python probes/probe_area_stats.py /tmp/t/GHS_POP_E2025_GLOBE_R2023A_4326_3ss_V1_0_R4_C20.tif /tmp/nuts.geojson --lake' | tee timing.md
          cat timing.md >> "$GITHUB_STEP_SUMMARY"
