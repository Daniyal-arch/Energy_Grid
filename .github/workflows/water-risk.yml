name: Water risk

# Water stress, flood and drought risk per river basin from WRI Aqueduct 4.0 (CC BY 4.0;
# docs/DATA_SOURCES.md, "Water risk"). Downloads the 262 MB zip, writes
# frontend/public/data/eu/water.json (categories per basin, outlines simplified to stay under
# 5 MB) and the lake tables (r2://infraatlas-raw/lake/aqueduct/: baseline_annual and basins as
# GeoParquet, baseline_monthly, future_annual), then commits the map file to the branch it
# runs on. Aqueduct 4.0 is a fixed release (2023-07-05): runs by hand and when this file or
# the script changes on main. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/magical-einstein-orqm4o]
    paths: [.github/workflows/water-risk.yml, scripts/build_aqueduct.py]

permissions:
  contents: write

concurrency:
  group: water-risk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Aqueduct 4.0 (262 MB)
        run: |
          pip install duckdb shapely pycountry
          curl -sfL --retry 3 -o aqueduct.zip https://files.wri.org/aqueduct/aqueduct-4-0-water-risk-data.zip
          ls -la aqueduct.zip

      - name: Map file and lake tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/build_aqueduct.py --zip aqueduct.zip --lake lake-out --upload
          python - <<'PY'
          import json
          cat = json.load(open("lake-out/aqueduct/_catalog.json"))
          print("| table | rows | bytes |\n|---|---:|---:|")
          for name, t in sorted(cat["tables"].items()):
              print(f"| {name} | {t['rows']:,} | {t['bytes']:,} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aqueduct-catalog
          path: lake-out/aqueduct/_catalog.json
          retention-days: 30

      - name: Commit the map file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/eu/water.json
          git diff --cached --quiet && exit 0
          git commit -m "Water risk: WRI Aqueduct 4.0 per basin"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
