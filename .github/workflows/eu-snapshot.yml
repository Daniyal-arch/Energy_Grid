name: Europe power snapshot

# Refreshes the Europe view's figures (cross-border flows, load, generation by
# source, prices; scripts/fetch_eu_snapshot.py, from ENTSO-E) every 30 min
# into eu/flows.json + eu/stats.json on the `eu-data` branch, plus eu/reference.json
# (installed capacity, reservoirs; scripts/fetch_eu_reference.py) once per run. The frontend reads
# them from raw.githubusercontent.com and falls back to its bundled copy.
#
# Same pattern as rail-realtime.yml: scheduled runs start late or not at all, so
# each run stays up for ~5 h 30 min and loops itself; the hourly schedule only
# has to fire once in that window.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eu-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Deadline for the snapshot loop
        # the job stops at 355 min; the reference step takes 7-25 min and a round up to 25 min,
        # so the loop starts its last round no later than 325 min after the job began
        run: echo "LOOP_END=$(( $(date +%s) + 325 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx python-dotenv eccodes

      - name: Reference figures (capacity, reservoirs, gas storage, Ember), once per run
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          # gas storage (GIE AGSI+) and Ember yearly data for the country cards
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
          EMBER_API_KEY: ${{ secrets.EMBER_API_KEY }}
        run: |
          mkdir -p ref
          python scripts/fetch_eu_reference.py --out ref || echo "reference fetch failed"
          # transfer capacity per border, today and tomorrow (for the flow arrows)
          python scripts/fetch_eu_capacity.py --out ref || echo "capacity fetch failed"
          python scripts/fetch_eu_dossier.py --out ref || echo "dossier fetch failed"
          # wind at 100 m (Open-Meteo), 6 h back and 24 h ahead: covers this run
          python scripts/fetch_wind.py --live --out ref || echo "wind fetch failed"
          # wind at 100 m and sunshine for the whole globe (ECMWF open data, every 3 h)
          python scripts/fetch_ecmwf.py --out ref || echo "ECMWF fetch failed"
          # a file that failed keeps the previous run's copy (each file carries its own times)
          if git fetch -q --depth=1 origin eu-data; then
            for f in reference dossier wind wind_world capacity; do
              [ -f "ref/$f.json" ] && continue
              if git show "FETCH_HEAD:eu/$f.json" > "ref/$f.json" 2>/dev/null; then echo "$f.json: previous copy kept"; else rm -f "ref/$f.json"; fi
            done
          fi

      - name: Snapshot every 30 min until the deadline
        env:
          # required: every live figure comes from ENTSO-E
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          while [ "$(date +%s)" -lt "$LOOP_END" ]; do
            started=$SECONDS
            rm -rf store && mkdir -p store/eu
            cp ref/reference.json ref/dossier.json ref/wind.json ref/wind_world.json ref/capacity.json store/eu/ 2>/dev/null || true
            # Australia's live market (AEMO, 5-min) rides along with each snapshot
            python scripts/fetch_aemo.py --out store/eu || echo "AEMO fetch failed"
            python scripts/fetch_brazil.py --out store/eu || echo "ONS fetch failed"
            python scripts/fetch_taiwan.py --out store/eu || echo "Taipower fetch failed"
            python scripts/fetch_ontario.py --out store/eu || echo "IESO fetch failed"
            # France's regions (RTE éCO2mix), New Zealand (Transpower) and South Africa (Eskom), no keys
            python scripts/build_regional_live.py fr --out store/eu || echo "éCO2mix regions failed"
            python scripts/build_regional_live.py nz --out store/eu || echo "Transpower fetch failed"
            python scripts/build_regional_live.py za --out store/eu || echo "Eskom fetch failed"
            # Great Britain's carbon intensity (NESO) and Denmark every 5 min (Energinet), no keys
            python scripts/fetch_gb_carbon.py --out store/eu || echo "GB carbon fetch failed"
            python scripts/fetch_dk_live.py --out store/eu || echo "Energinet fetch failed"
            # CO₂ per kWh as France (RTE), Spain (REE) and Ireland (EirGrid) publish it, no keys
            python scripts/fetch_live_co2.py eu --out store/eu || echo "operator CO2 fetch failed"
            # the US grid (EIA-930); needs the EIA_API_KEY secret
            python scripts/fetch_us.py --out store/eu || echo "EIA fetch failed"
            # generating units offline now (ENTSO-E unavailability)
            python scripts/fetch_outages.py --out store/eu || echo "outages fetch failed"
            python scripts/fetch_gb_outages.py --out store/eu || echo "GB outages (Elexon REMIT) failed"
            if python scripts/fetch_eu_snapshot.py --out store/eu; then
              (
                cd store
                git init -q -b eu-data
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -q -m "Europe power snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -q -f "$REMOTE" eu-data
              ) || echo "push failed; next snapshot retries"
            else
              echo "snapshot failed; retrying next round"
            fi
            wait=$((1800 - (SECONDS - started)))
            if [ "$wait" -gt 0 ] && [ $(( $(date +%s) + wait )) -lt "$LOOP_END" ]; then sleep "$wait"; else break; fi
          done
