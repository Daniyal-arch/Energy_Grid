name: World high-voltage lines

# Builds the grid layer for the world: every power line of 220 kV and more mapped in
# OpenStreetMap (scripts/fetch_world_hv.py, Overpass, 10° boxes). Eight regions are fetched
# in parallel jobs (each with its own time limit), merged (a line in two regions is kept
# once), cut into vector tiles with tippecanoe (zoom 0-9; 500 kV+ from zoom 0, 300 kV+ from
# 1, the rest from 3) and uploaded to the R2 bucket infraatlas-data as grid/world-hv.pmtiles.
# Re-run by hand to refresh (Actions > World high-voltage lines > Run workflow). Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/world-hv.yml]

permissions:
  contents: read

concurrency:
  group: world-hv
  cancel-in-progress: true

jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        region: [na, sa, eu, af, mea, north, asia, oc]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the region's lines from OpenStreetMap
        run: |
          pip install httpx
          python scripts/fetch_world_hv.py --region ${{ matrix.region }} --out hv-${{ matrix.region }}.geojsons

      - uses: actions/upload-artifact@v4
        with:
          name: hv-${{ matrix.region }}
          path: hv-${{ matrix.region }}.geojsons
          retention-days: 3

  tiles:
    needs: region
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hv-*
          merge-multiple: true

      - name: Merge the regions (each line once)
        run: |
          ls -la hv-*.geojsons
          cat hv-*.geojsons | sort -u > hv.geojsons
          wc -l hv.geojsons

      - name: Build tippecanoe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j4
          sudo make -C /tmp/tippecanoe install

      - name: Cut into vector tiles
        run: |
          tippecanoe -o world-hv.pmtiles -l hv -Z0 -z9 --simplification=6 \
            --no-feature-limit --no-tile-size-limit \
            --attribution='© OpenStreetMap contributors (ODbL)' --force hv.geojsons
          ls -la world-hv.pmtiles

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put infraatlas-data/grid/world-hv.pmtiles \
            --file world-hv.pmtiles --content-type application/vnd.pmtiles --remote
