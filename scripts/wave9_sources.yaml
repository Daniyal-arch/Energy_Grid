# Wave 9 source registry (docs/tasks/28-wave9-customer-needs.md). One entry per source probed.
# scripts/wave9.py probes every entry, builds the ones with status `build` into the lake, and
# renders the coverage families, docs/research/wave9-sources.md and the catalogue from here.
#
# id: lake dataset/table key (dataset = cat-prefixed id), cat: category number (0 = Part A),
# fam: coverage family, places: ISO2 list or EU27 / EUR (the ENTSO-E area) / WORLD,
# level: point, line, polygon, raster or the ladder unit the values are keyed by,
# kind: csv | xlsx | json | geojson | gpkg | shp_zip | gpkg_zip | geojson_zip | csv_zip |
#       arcgis (a FeatureServer/MapServer layer, paged) | ods_api (Opendatasoft export) |
#       ckan (a CKAN package: newest resource of `fmt`) | page (probe only) | custom (wave9.py),
# url: the file or service, licence: as found, lic_url: the page the licence quote comes from,
# status: build | blocked | not_published | left_out (with `why` and, for blocked, `request`).
# Optional: lon/lat columns, crs (source CRS when not WGS 84), sheet, skip (rows before the
# header), layer, sep, where (ArcGIS filter), size (bytes, from the probe), note.
