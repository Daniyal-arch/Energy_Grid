  - {id: ie_eirgrid_dispatch_down, title: EirGrid renewable dispatch-down (constraints and curtailment) summary, cat: 2, fam: congestion, places: [IE], level: country, kind: custom, url: 'https://www.eirgrid.ie/sites/default/files/publications/DD-Summary-Report-V23.xlsx', licence: 'EirGrid Group Open Data Licence (commercial use allowed, credit ''Supported by EirGrid Group Data'')', lic_url: 'https://www.smartgriddashboard.com/ni/open-data-license', status: build, size: 1937254, sheet: Wind & Solar Monthly Detailed, note: 'linked from https://www.eirgrid.ie/grid/system-and-renewable-data-reports (Renewable Dispatch Down Reports; the cms.eirgrid.ie link redirects here). Sheets: DD Summary, DD Perc from 2011 to date, Regional Wind & Solar (per region MID/... with Cap MW, constraints vs curtailments %), Wind & Solar Monthly Detailed (2016-2026 per month for All Island / IE / NI wind: Availability, Generation, Dispatch Down, Constraints, Transmission Constraints, TSO Testing, Curtailments, High Freq/Min Gen, ROCOF/Inertia, SNSP, Other, MWh and %), All RES DD Monthly Detailed. Two header rows (rows 3-4) and side-by-side blocks: needs a small custom reshape (wave9.py xlsx kind reads one header row). Versioned file name (V23): find the newest link on the page. Licence quote: ''The Licensor grants you a worldwide, royalty-free, perpetual, non-exclusive licence to use the Information'' ... ''exploit the Information commercially and non-commercially''; covers datasets in the EirGrid or SONI Libraries and SEMO'}
